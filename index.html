/* Layout: one-column app shell, max 760px; bottom tab bar on phones, top tab row on wide screens */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --ink:#161B3D; --muted:#5B6180; --line:#DDE0EC;
  --accent:#1E2A6E; --accent-ink:#FFFFFF; --accent-soft:#E6E9F6;
  --gold:#B7800A; --gold-soft:#FDF2D3; --out:#C4262B; --out-soft:#FBE3E3;
  --hero:#1B2462; --hero-ink:#FFFFFF; --stripe:#F2B01E; --in:#1F7A4F;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1027; --surface:#161B3A; --ink:#E9EBF7; --muted:#9EA4C4; --line:#2A3060;
  --accent:#F2B630; --accent-ink:#1A1F4D; --accent-soft:#2E2A1E;
  --gold:#F2B630; --gold-soft:#2E2812; --out:#F2777A; --out-soft:#3A1A22;
  --hero:#1F2870; --hero-ink:#FFFFFF; --stripe:#F2B01E; --in:#5DD39A; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.noapp{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:48px;height:48px;border-radius:50%;flex:none;display:block;object-fit:cover;background:#fff;box-shadow:0 2px 8px rgba(20,25,70,.18)}
.brand h1{font-size:19px;font-weight:800;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand > div{min-width:0}
.hdr-right{display:flex;align-items:center;gap:8px;flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.lang button{border:0;background:none;padding:4px 9px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;
  color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;border-radius:10px;min-width:0}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:820px){
  body{padding-bottom:40px}
  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);border:1px solid var(--line);border-radius:var(--r);max-width:760px;margin:0 auto 18px;padding:4px}
  nav.tabs button{flex-direction:row;justify-content:center;font-size:13px;gap:6px}
  nav.tabs svg{width:18px;height:18px}
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border:1px solid var(--line);background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14px}
section.view{display:flex;flex-direction:column;gap:16px;padding-bottom:12px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sechead h2{font-size:22px;font-weight:800}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.out{background:var(--out-soft);color:var(--out)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{background:var(--out);color:#fff}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;text-decoration:underline}
.fund{position:relative;border-radius:18px;background:var(--hero);color:var(--hero-ink);padding:22px 20px 18px;overflow:hidden}
.fund::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(135deg,var(--stripe) 0 10px,transparent 10px 20px)}
.fund .heart{position:absolute;right:18px;top:20px;width:22px;height:22px;fill:#E8262C}
.fund .label{color:inherit;opacity:.8}
.fund .big{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,8vw,46px);line-height:1.05;margin-top:4px}
.fund .big span{font-size:.45em;font-weight:600;opacity:.85;margin-right:6px}
.fundgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;border-top:1px solid rgba(255,255,255,.25);padding-top:12px}
.fundgrid div{min-width:0}
.fundgrid b{display:block;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fundgrid small{opacity:.8;font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel > .label{display:block;margin-bottom:8px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{min-width:0;flex:1}
.title{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--in)} .amt.outv{color:var(--out)}
.clickable{cursor:pointer}
.clickable:hover .title,.title.clickable:hover{color:var(--accent)}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;vertical-align:middle}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.grey{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.empty b{color:var(--ink)}
.meeting{display:flex;gap:14px;align-items:flex-start;min-width:0;flex:1}
.cal{flex:none;width:54px;border-radius:10px;border:1px solid var(--line);text-align:center;overflow:hidden;background:var(--surface)}
.cal .m{background:var(--out);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal .d{font-family:var(--f-display);font-weight:800;font-size:22px;padding:2px 0 4px}
.notes{white-space:pre-wrap;margin-top:6px;font-size:14px;overflow-wrap:anywhere}
details.req{border-top:1px solid var(--line);padding:10px 0}
details.req:first-child{border-top:0}
details.req summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
details.req summary::-webkit-details-marker{display:none}
.reqbody{margin-top:8px;display:flex;flex-direction:column;gap:10px}
.resp{border-left:3px solid var(--stripe);padding-left:10px;font-size:14px}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.filter select{width:auto;max-width:100%}
.copy{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px}
.sel{user-select:all}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(8,12,40,.5)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px}
dialog h3{font-size:19px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.formbtns{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
/* sign-in screens */
.gate{max-width:420px;margin:4vh auto 0;display:flex;flex-direction:column;gap:16px}
.gate .logo-big{width:132px;height:132px;border-radius:50%;margin:0 auto;display:block;box-shadow:0 6px 24px rgba(20,25,70,.22);background:#fff}
.gate h2{text-align:center;font-size:26px;font-weight:800}
.gate .motto{text-align:center;color:var(--muted);margin-top:-8px;letter-spacing:.06em;text-transform:uppercase;font-size:12px;font-weight:700}
.gate form{display:flex;flex-direction:column;gap:12px}
.err{color:var(--out);font-size:14px;min-height:1em}
.center{text-align:center}
@media (prefers-reduced-motion:no-preference){.fund{animation:rise .4s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}

members:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.3"/><path d="M16 14.2c2.8.2 5 2.5 5 5.3"/>',

const HEART='<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg>';
const TABS=["home","money","help","members","meetings","news"];
const COLS=["members","money","requests","meetings","news"];
const ADMIN_ROLES=["chair","secretary","treasurer"];

/* ---------------- state ---------------- */
let lang="en",tab="home",moneyFilter="",screen="loading",gateMode="signin",gateMsg="",gateErr="";
let auth=null,db=null,me=null,myAccess=null,isOwner=false,isAdmin=false,dbReady=false;
let unsubs=[],installEvt=null;
const S={members:[],money:[],requests:[],meetings:[],news:[]};
const t=()=>T[lang];
try{const l=localStorage.getItem("cg-lang");if(l==="sw"||l==="en")lang=l;const tb=localStorage.getItem("cg-tab");if(TABS.includes(tb))tab=tb;}catch(e){}

/* ---------------- helpers ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN=n=>new Intl.NumberFormat("en-US").format(Math.round(Number(n)||0));
const tsh=n=>"TSh "+fmtN(n);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const pd=iso=>iso?new Date(iso+"T00:00:00"):null;
const loc=()=>lang==="sw"?"sw-TZ":"en-GB";
function fdate(iso){const d=pd(iso);if(!d||isNaN(d))return"";try{return d.toLocaleDateString(loc(),{day:"numeric",month:"short",year:"numeric"})}catch(e){return iso}}
function fmonth(key){const d=pd(key+"-01");if(!d||isNaN(d))return key;try{return d.toLocaleDateString(loc(),{month:"long",year:"numeric"})}catch(e){return key}}
const lower=e=>String(e||"").trim().toLowerCase();
const memberName=id=>(S.members.find(m=>m.id===id)||{}).name||t().person;
const sortedMembers=()=>[...S.members].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
const myMemberId=()=>myAccess&&myAccess.memberId||null;
let toastT;function toast(msg){const el=$("toast");el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}

function totals(){let inn=0,out=0,month=0;const mk=today().slice(0,7);
  for(const r of S.money){const a=Number(r.amount)||0;if(r.kind==="out")out+=a;else{inn+=a;if((r.date||"").startsWith(mk))month+=a}}
  return{inn,out,bal:inn-out,month}}
function memberTotals(id){const y=today().slice(0,4);let all=0,yr=0;
  for(const r of S.money)if(r.kind!=="out"&&r.memberId===id){const a=Number(r.amount)||0;all+=a;if((r.date||"").startsWith(y))yr+=a}
  return{all,yr}}

/* ---------------- chrome ---------------- */
function renderChrome(){
  $("tagline").textContent=t().tagline;
  document.documentElement.lang=lang==="sw"?"sw":"en";
  $("lang-en").setAttribute("aria-pressed",lang==="en");
  $("lang-sw").setAttribute("aria-pressed",lang==="sw");
  const inApp=screen==="app";
  document.body.classList.toggle("noapp",!inApp);
  $("tabs").hidden=!inApp;
  $("accountbtn").hidden=!(inApp||screen==="notmember"||screen==="verify");
  if(inApp)$("tabs").innerHTML=TABS.map(k=>`<button type="button" data-tab="${k}" ${k===tab?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg><span>${esc(t()[k])}</span></button>`).join("");
  const b=$("banner");
  if(inApp&&!navigator.onLine){b.textContent=t().offline;b.hidden=false}else b.hidden=true;
}

/* ---------------- gate screens ---------------- */
function gateShell(inner){return `<div class="gate"><img class="logo-big" src="icon-512.png" alt="Charity Group logo"><h2>Charity Group</h2><div class="motto">${esc(t().tagline)}</div>${inner}</div>`}
function renderGate(){const L=t();const v=$("view");
  if(screen==="loading"){v.innerHTML=gateShell(`<p class="center meta">${esc(L.loading)}</p>`);return}
  if(screen==="setup"){v.innerHTML=gateShell(`<div class="panel"><h3>${esc(L.setupTitle)}</h3><p>${esc(L.setupBody)}</p></div>`);return}
  if(screen==="signin"){const up=gateMode==="signup";
    v.innerHTML=gateShell(`<form id="authform" novalidate>
      <div class="field"><label for="a-email">${esc(L.email)}</label><input id="a-email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label for="a-pw">${esc(L.password)}</label><input id="a-pw" type="password" autocomplete="${up?"new-password":"current-password"}" required minlength="6">${up?`<span class="hint">${esc(L.pwHint)}</span>`:""}</div>
      <div class="err" id="a-err">${esc(gateErr)}</div>${gateMsg?`<div class="meta">${esc(gateMsg)}</div>`:""}
      <button type="submit" class="btn block" id="a-submit">${esc(up?L.signup:L.signin)}</button>
      <div class="center"><button type="button" class="link" id="a-switch">${esc(up?L.haveAcc:L.noAcc)}</button></div>
      ${up?"":`<div class="center"><button type="button" class="link" id="a-forgot">${esc(L.forgot)}</button></div>`}
    </form>`);return}
  if(screen==="verify"){v.innerHTML=gateShell(`<div class="panel"><h3>${esc(L.verifyTitle)}</h3><p>${esc(L.verifyBody.replace("{e}",me?me.email:""))}</p>
    <div class="err" id="a-err">${esc(gateErr)}</div>${gateMsg?`<p class="meta">${esc(gateMsg)}</p>`:""}
    <div class="btns"><button type="button" class="btn" id="v-continue">${esc(L.continue)}</button><button type="button" class="btn ghost" id="v-resend">${esc(L.resend)}</button></div>
    <p><button type="button" class="link" id="g-signout">${esc(L.signout)}</button></p></div>`);return}
  if(screen==="notmember"){v.innerHTML=gateShell(`<div class="panel"><h3>${esc(L.notMemberTitle)}</h3><p>${esc(L.notMemberBody.replace("{e}",me?me.email:""))}</p>
    <div class="btns"><button type="button" class="btn" id="n-check">${esc(L.checkAgain)}</button><button type="button" class="btn ghost" id="g-signout">${esc(L.signout)}</button></div></div>`);return}
}
function authError(e){const L=t();return (e&&L.ae[e.code])||L.errGen}

/* ---------------- app views ---------------- */
const addBtn=(action,label,cls="")=>`<button type="button" class="btn ${cls}" data-act="${action}">+ ${esc(label)}</button>`;
const empty=html=>`<div class="empty">${dbReady?html:esc(t().loading)}</div>`;
const fundCard=s=>{const L=t();return `<div class="fund">${HEART}<div class="label">${esc(L.fund)}</div><div class="big num"><span>TSh</span>${esc(fmtN(s.bal))}</div>
  <div class="fundgrid"><div><small>${esc(L.collected)}</small><b>${esc(tsh(s.inn))}</b></div><div><small>${esc(L.given)}</small><b>${esc(tsh(s.out))}</b></div><div><small>${esc(L.thisMonth)}</small><b>${esc(tsh(s.month))}</b></div></div></div>`};
function editAttrs(col,id,allowed){return allowed?`data-edit="${col}:${esc(id)}" tabindex="0" role="button"`:""}
function moneyRow(r){const out=r.kind==="out";
  return `<div class="row ${isAdmin?"clickable":""}" ${editAttrs("money",r.id,isAdmin)}><div class="main"><div class="title">${esc(memberName(r.memberId))}</div>
  <div class="meta">${esc(fdate(r.date))} · ${esc(out?t().support:t().contribution)}${r.note?" · "+esc(r.note):""}</div></div>
  <div class="amt ${out?"outv":"in"}">${out?"−":"+"} ${esc(tsh(r.amount))}</div></div>`}
function statusChip(s){return `<span class="chip ${s==="open"?"gold":s==="supported"?"":"grey"}">${esc(t().st[s]||s)}</span>`}
function calBox(iso){const d=pd(iso);let m="",dd="";try{m=d.toLocaleDateString(loc(),{month:"short"});dd=d.getDate()}catch(e){}
  return `<div class="cal" aria-hidden="true"><div class="m">${esc(m)}</div><div class="d num">${esc(dd)}</div></div>`}
function meetingItem(m){const L=t();return `<div class="row ${isAdmin?"clickable":""}" ${editAttrs("meetings",m.id,isAdmin)}><div class="meeting">${calBox(m.date)}<div class="main">
  <div class="title">${esc(fdate(m.date))}${m.time?" · "+esc(m.time):""}</div>${m.place?`<div class="meta">${esc(m.place)}</div>`:""}
  ${m.agenda?`<div class="notes"><span class="label">${esc(L.agenda)}</span><br>${esc(m.agenda)}</div>`:""}
  ${m.notes?`<div class="notes"><span class="label">${esc(L.minutes)}</span><br>${esc(m.notes)}</div>`:""}</div></div></div>`}
function newsItem(n){return `<div class="row ${isAdmin?"clickable":""}" ${editAttrs("news",n.id,isAdmin)}><div class="main">
  <div class="title">${n.pinned?`<span class="chip gold">${esc(t().pinnedL)}</span> `:""}${esc(n.title)}</div>
  <div class="meta">${esc(fdate(n.date))}</div>${n.body?`<div class="notes">${esc(n.body)}</div>`:""}</div></div>`}
const upcomingMeetings=()=>S.meetings.filter(m=>(m.date||"")>=today()).sort((a,b)=>((a.date||"")+(a.time||"")).localeCompare((b.date||"")+(b.time||"")));
const pastMeetings=()=>S.meetings.filter(m=>(m.date||"")<today()).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
const sortedNews=()=>[...S.news].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.date||"").localeCompare(a.date||""));
const sortedReqs=()=>[...S.requests].sort((a,b)=>((a.status||"open")==="open"?0:1)-((b.status||"open")==="open"?0:1)||(b.date||"").localeCompare(a.date||""));
const canEditReq=r=>isAdmin||(me&&r.createdBy===me.uid);
function reqItem(r,open){const L=t();const resp=Array.isArray(r.responses)?r.responses:[];
  return `<details class="req" ${open?"open":""}><summary><div class="main"><div class="title">${esc(r.title)}</div>
  <div class="meta">${esc(memberName(r.memberId))} · ${esc(fdate(r.date))}${resp.length?` · ${resp.length} ${esc(L.responses)}`:""}</div></div>
  <div style="text-align:right">${statusChip(r.status||"open")}${r.amount?`<div class="amt num" style="margin-top:4px">${esc(tsh(r.amount))}</div>`:""}</div></summary>
  <div class="reqbody">${r.detail?`<div class="notes">${esc(r.detail)}</div>`:""}
  ${resp.map(x=>`<div class="resp"><b>${esc(memberName(x.memberId))}</b> · <span class="meta">${esc(fdate(x.date))}</span><div>${esc(x.text)}</div></div>`).join("")}
  <div class="btns">${(r.status||"open")!=="closed"?`<button type="button" class="btn small" data-offer="${esc(r.id)}">${esc(L.offer)}</button>`:""}${canEditReq(r)?`<button type="button" class="btn small ghost" data-edit="requests:${esc(r.id)}">${esc(L.editReq)}</button>`:""}</div>
  </div></details>`}

function renderApp(){const v=$("view");const L=t();let h="";
  if(tab==="home"){const nm=upcomingMeetings()[0];const reqs=sortedReqs().filter(r=>(r.status||"open")==="open").slice(0,3);const nw=sortedNews().slice(0,3);
    h=`${fundCard(totals())}
    <div class="btns">${isAdmin?addBtn("money-in",L.recordIn):""}${addBtn("req",L.newReq,isAdmin?"ghost":"")}</div>
    <div class="two"><div class="panel"><span class="label">${esc(L.nextMeeting)}</span>${nm?`<div class="list">${meetingItem(nm)}</div>`:empty(esc(L.noMeeting))}</div>
    <div class="panel"><span class="label">${esc(L.openReq)}</span>${reqs.length?`<div class="list">${reqs.map(r=>reqItem(r,false)).join("")}</div>`:empty(L.emptyReq)}</div></div>
    <div class="panel"><span class="label">${esc(L.latestNews)}</span>${nw.length?`<div class="list">${nw.map(newsItem).join("")}</div>`:empty(L.emptyNews)}</div>`;
  }
  if(tab==="money"){let rows=[...S.money].sort((a,b)=>(b.date||"").localeCompare(a.date||""));if(moneyFilter)rows=rows.filter(r=>r.memberId===moneyFilter);
    const groups={};for(const r of rows){const k=(r.date||"").slice(0,7);(groups[k]=groups[k]||[]).push(r)}
    h=`<div class="sechead"><h2>${esc(L.money)}</h2>${isAdmin?`<div class="btns">${addBtn("money-in",L.recordIn)}${addBtn("money-out",L.recordOut,"out")}</div>`:""}</div>
    ${fundCard(totals())}
    ${S.members.length?`<div class="filter"><label class="label" for="mfilter">${esc(L.member)}</label><select id="mfilter"><option value="">${esc(L.allMembers)}</option>${sortedMembers().map(m=>`<option value="${esc(m.id)}" ${m.id===moneyFilter?"selected":""}>${esc(m.name)}</option>`).join("")}</select></div>`:""}
    ${rows.length?Object.keys(groups).map(k=>{const g=groups[k];const net=g.reduce((a,r)=>a+(r.kind==="out"?-1:1)*(Number(r.amount)||0),0);
      return `<div class="panel"><div class="sechead"><span class="label">${esc(fmonth(k))}</span><span class="amt num ${net<0?"outv":"in"}">${net<0?"−":"+"} ${esc(tsh(Math.abs(net)))}</span></div><div class="list">${g.map(moneyRow).join("")}</div></div>`}).join("")
    :`<div class="panel">${empty(L.emptyMoney)}</div>`}`;
  }
  if(tab==="help"){const rs=sortedReqs();
    h=`<div class="sechead"><h2>${esc(L.help)}</h2>${addBtn("req",L.newReq)}</div>
    <div class="panel">${rs.length?`<div class="list">${rs.map(r=>reqItem(r,(r.status||"open")==="open")).join("")}</div>`:empty(L.emptyReq)}</div>`;
  }
  if(tab==="members"){const ms=sortedMembers();
    h=`<div class="sechead"><h2>${esc(L.members)} <span class="label num">${ms.length}</span></h2>${isAdmin?addBtn("member",L.addMember):""}</div>
    <div class="panel">${ms.length?`<div class="list">${ms.map(m=>{const mt=memberTotals(m.id);return `<div class="row"><div class="main">
      <div class="title ${isAdmin?"clickable":""}" ${editAttrs("members",m.id,isAdmin)}>${esc(m.name)} ${m.role&&m.role!=="member"?`<span class="chip">${esc(L.roles[m.role]||m.role)}</span>`:""}</div>
      ${m.phone?`<div class="meta"><span class="sel num">${esc(m.phone)}</span> <button type="button" class="copy" data-copy="${esc(m.phone)}">${esc(L.copy)}</button></div>`:""}
      ${isAdmin&&m.email?`<div class="meta">${esc(m.email)}</div>`:""}
      ${m.joined?`<div class="meta">${esc(L.joined)} ${esc(fdate(m.joined))}</div>`:""}</div>
      <div style="text-align:right"><div class="amt in">${esc(tsh(mt.all))}</div><div class="meta">${esc(L.yearTotal)}: <span class="num">${esc(tsh(mt.yr))}</span></div></div></div>`}).join("")}</div>`:empty(L.emptyMembers)}</div>`;
  }
  if(tab==="meetings"){const up=upcomingMeetings(),pa=pastMeetings();
    h=`<div class="sechead"><h2>${esc(L.meetings)}</h2>${isAdmin?addBtn("meeting",L.newMeeting):""}</div>
    <div class="panel"><span class="label">${esc(L.upcoming)}</span>${up.length?`<div class="list">${up.map(meetingItem).join("")}</div>`:empty(S.meetings.length?esc(L.noMeeting):L.emptyMeet)}</div>
    ${pa.length?`<div class="panel"><span class="label">${esc(L.past)}</span><div class="list">${pa.map(meetingItem).join("")}</div></div>`:""}`;
  }
  if(tab==="news"){const ns=sortedNews();
    h=`<div class="sechead"><h2>${esc(L.news)}</h2>${isAdmin?addBtn("news",L.newNews):""}</div>
    <div class="panel">${ns.length?`<div class="list">${ns.map(newsItem).join("")}</div>`:empty(L.emptyNews)}</div>`;
  }
  v.innerHTML=h;
}
function render(){renderChrome();if(screen==="app")renderApp();else renderGate()}

/* ---------------- forms ---------------- */
const sheet=$("sheet"),form=$("sheetform");
let formCtx=null,delArmed=false;
function memberOptions(sel){return sortedMembers().map(m=>`<option value="${esc(m.id)}" ${m.id===sel?"selected":""}>${esc(m.name)}</option>`).join("")}
function field(f,val){const id="f-"+f.k;let inp="";
  if(f.type==="textarea")inp=`<textarea id="${id}" name="${f.k}" rows="4">${esc(val)}</textarea>`;
  else if(f.type==="member")inp=`<select id="${id}" name="${f.k}" required>${memberOptions(val)}</select>`;
  else if(f.type==="select")inp=`<select id="${id}" name="${f.k}">${f.opts.map(([v,l])=>`<option value="${esc(v)}" ${v===val?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  else if(f.type==="check")return `<label class="field" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="${id}" name="${f.k}" style="width:auto" ${val?"checked":""}> <span>${esc(f.label)}</span></label>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.type}" ${f.type==="number"?'inputmode="numeric" min="0" step="1"':""} ${f.type==="email"?'inputmode="email" autocapitalize="off"':""} ${f.req?"required":""} value="${esc(val)}">`;
  return `<div class="field"><label for="${id}">${esc(f.label)}</label>${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`}
function SPECS(){const L=t();const mine=!isAdmin&&myMemberId();return{
  "money-in":{col:"money",title:L.recordIn,fixed:{kind:"in"},needMembers:true,fields:[{k:"memberId",type:"member",label:L.member,req:true},{k:"amount",type:"number",label:L.amount,req:true},{k:"date",type:"date",label:L.date,req:true,def:today()},{k:"note",type:"text",label:L.note}]},
  "money-out":{col:"money",title:L.recordOut,fixed:{kind:"out"},needMembers:true,fields:[{k:"memberId",type:"member",label:L.member,req:true},{k:"amount",type:"number",label:L.amount,req:true},{k:"date",type:"date",label:L.date,req:true,def:today()},{k:"note",type:"text",label:L.note}]},
  "member":{col:"members",title:L.addMember,editTitle:L.editMember,fields:[{k:"name",type:"text",label:L.name,req:true},{k:"email",type:"email",label:L.email,hint:L.emailHint},{k:"phone",type:"tel",label:L.phone},{k:"role",type:"select",label:L.role,def:"member",hint:L.roleHint,opts:Object.entries(L.roles)},{k:"joined",type:"date",label:L.joined}]},
  "req":{col:"requests",title:L.newReq,editTitle:L.editReq,needMembers:true,fields:[...(mine?[]:[{k:"memberId",type:"member",label:L.forMember,req:true}]),{k:"title",type:"text",label:L.reqTitle,req:true},{k:"detail",type:"textarea",label:L.reqDetail},{k:"amount",type:"number",label:L.reqAmount},{k:"date",type:"date",label:L.date,def:today()},{k:"status",type:"select",label:L.status,def:"open",opts:Object.entries(L.st)}],fixed:mine?{memberId:mine}:{}},
  "meeting":{col:"meetings",title:L.newMeeting,editTitle:L.editMeeting,fields:[{k:"date",type:"date",label:L.date,req:true,def:today()},{k:"time",type:"time",label:L.time},{k:"place",type:"text",label:L.place},{k:"agenda",type:"textarea",label:L.agenda},{k:"notes",type:"textarea",label:L.minutes}]},
  "news":{col:"news",title:L.newNews,editTitle:L.editNews,fields:[{k:"title",type:"text",label:L.newsTitle,req:true},{k:"body",type:"textarea",label:L.newsBody},{k:"date",type:"date",label:L.date,def:today()},{k:"pinned",type:"check",label:L.pinned}]},
}}
const COL2SPEC={members:"member",requests:"req",meetings:"meeting",news:"news"};
function openForm(key,docData){const L=t();const spec=SPECS()[key];if(!spec)return;
  if(spec.needMembers&&!S.members.length){toast(L.needMembers);return}
  if(key==="req"&&docData&&!isAdmin){spec.fixed={memberId:docData.memberId}}
  formCtx={key,spec,doc:docData};delArmed=false;
  form.innerHTML=`<h3>${esc(docData&&spec.editTitle?spec.editTitle:spec.title)}</h3>${spec.fields.map(f=>field(f,docData?docData[f.k]:(f.def??""))).join("")}
  <div class="err" id="f-err"></div>
  <div class="formbtns"><div>${docData?`<button type="button" class="btn ghost" id="delbtn">${esc(L.del)}</button>`:""}</div>
  <div class="btns"><button type="button" class="btn ghost" id="cancelbtn">${esc(L.cancel)}</button><button type="submit" class="btn">${esc(L.save)}</button></div></div>`;
  sheet.showModal()}
function openOffer(reqId){const L=t();if(!S.members.length){toast(L.needMembers);return}
  const mine=myMemberId();
  formCtx={key:"offer",reqId};form.innerHTML=`<h3>${esc(L.offer)}</h3>${isAdmin||!mine?field({k:"memberId",type:"member",label:L.member,req:true},mine||""):""}${field({k:"text",type:"textarea",label:L.offerMsg},"")}
  <div class="err" id="f-err"></div>
  <div class="formbtns"><div></div><div class="btns"><button type="button" class="btn ghost" id="cancelbtn">${esc(L.cancel)}</button><button type="submit" class="btn">${esc(L.save)}</button></div></div>`;sheet.showModal()}
function writeErr(e){toast(e&&e.code==="permission-denied"?t().errWrite:t().errGen)}
function run(p){p.then(()=>{}).catch(writeErr)}

form.addEventListener("submit",ev=>{ev.preventDefault();if(!db||!formCtx)return;const fd=new FormData(form);
  // simple required-field check
  for(const el of form.querySelectorAll("[required]")){if(!String(el.value||"").trim()){el.focus();$("f-err").textContent="✱ "+(el.labels&&el.labels[0]?el.labels[0].textContent:"");return}}
  if(formCtx.key==="offer"){const r=S.requests.find(x=>x.id===formCtx.reqId);if(!r)return;
    const resp=[...(Array.isArray(r.responses)?r.responses:[]),{memberId:String(fd.get("memberId")||myMemberId()||""),text:String(fd.get("text")||"").trim(),date:today(),by:me.uid}];
    sheet.close();toast(t().saved);run(updateDoc(doc(db,"requests",r.id),{responses:resp}));return}
  const {spec,doc:old}=formCtx;const data={...(spec.fixed||{})};
  for(const f of spec.fields){if(f.type==="check")data[f.k]=fd.get(f.k)==="on";
    else if(f.type==="number"){const v=String(fd.get(f.k)??"").trim();data[f.k]=v===""?null:Math.max(0,Math.round(Number(v.replace(/[, ]/g,"")))||0)}
    else if(f.type==="email")data[f.k]=lower(fd.get(f.k));
    else data[f.k]=String(fd.get(f.k)??"").trim()}
  sheet.close();toast(t().saved);
  const now=new Date().toISOString();
  if(old){const{id,...rest}=old;run(setDoc(doc(db,spec.col,id),{...rest,...data,updatedAt:now}).then(()=>spec.col==="members"?syncAccess(id,old.email,data):null))}
  else{if(spec.col==="requests"){data.responses=[];data.createdBy=me.uid}
    const ref=doc(collection(db,spec.col));
    run(setDoc(ref,{...data,createdAt:now}).then(()=>spec.col==="members"?syncAccess(ref.id,"",data):null))}
});
async function syncAccess(memberId,oldEmail,data){
  const ne=lower(data.email),oe=lower(oldEmail);
  if(oe&&oe!==ne)await deleteDoc(doc(db,"access",oe));
  if(ne)await setDoc(doc(db,"access",ne),{memberId,admin:ADMIN_ROLES.includes(data.role),name:data.name||""});
}
form.addEventListener("click",ev=>{const L=t();
  if(ev.target.id==="cancelbtn"){sheet.close();return}
  if(ev.target.id==="delbtn"){if(!delArmed){delArmed=true;ev.target.textContent=L.delSure;ev.target.className="btn danger";return}
    const{spec,doc:old}=formCtx;sheet.close();toast(L.deleted);
    run(deleteDoc(doc(db,spec.col,old.id)).then(()=>spec.col==="members"&&old.email?deleteDoc(doc(db,"access",lower(old.email))):null))}});

/* account sheet */
function openAccount(){const L=t();
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone;
  form.innerHTML=`<h3>${esc(L.account)}</h3>
  <div><div class="label">${esc(L.signedInAs)}</div><div class="title">${esc(me?me.email:"")}</div></div>
  ${screen==="app"?`<div><div class="label">${esc(L.yourRole)}</div><div>${esc(isAdmin?L.adminRole:L.memberRole)}${myMemberId()?" · "+esc(memberName(myMemberId())):""}</div></div>`:""}
  ${installEvt?`<button type="button" class="btn" id="installbtn">${esc(L.install)}</button>`:ios?`<p class="hint">${esc(L.installIos)}</p>`:""}
  <div class="formbtns"><button type="button" class="btn ghost" id="signoutbtn">${esc(L.signout)}</button><button type="button" class="btn" id="cancelbtn">OK</button></div>`;
  formCtx=null;sheet.showModal()}
form.addEventListener("click",async ev=>{
  if(ev.target.id==="signoutbtn"){sheet.close();await signOut(auth)}
  if(ev.target.id==="installbtn"&&installEvt){sheet.close();installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null}});

/* ---------------- events ---------------- */
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;try{localStorage.setItem("cg-tab",tab)}catch(_){}render();window.scrollTo({top:0})});
function setLang(l){lang=l;try{localStorage.setItem("cg-lang",l)}catch(_){}if(auth)auth.languageCode=l;render()}
$("lang-en").onclick=()=>setLang("en");
$("lang-sw").onclick=()=>setLang("sw");
$("accountbtn").onclick=openAccount;
function activate(el){
  if(el.dataset.act){openForm(el.dataset.act);return true}
  if(el.dataset.offer){openOffer(el.dataset.offer);return true}
  if(el.dataset.copy!==undefined){const txt=el.dataset.copy;try{navigator.clipboard.writeText(txt).then(()=>toast(t().copied),()=>{})}catch(_){}return true}
  if(el.dataset.edit){const[col,id]=el.dataset.edit.split(":");const d=S[col].find(x=>x.id===id);if(!d)return true;
    const key=col==="money"?(d.kind==="out"?"money-out":"money-in"):COL2SPEC[col];openForm(key,d);return true}
  return false}
$("view").addEventListener("click",async e=>{
  const el=e.target.closest("[data-act],[data-offer],[data-copy],[data-edit]");if(el&&activate(el)){e.preventDefault();return}
  const id=e.target.id;const L=t();
  if(id==="a-switch"){gateMode=gateMode==="signin"?"signup":"signin";gateErr="";gateMsg="";render()}
  if(id==="a-forgot"){const em=lower($("a-email").value);if(!em){$("a-err").textContent=L.ae["auth/invalid-email"];return}
    try{await sendPasswordResetEmail(auth,em);gateErr="";gateMsg=L.resetSent}catch(err){gateErr=authError(err);gateMsg=""}render()}
  if(id==="v-continue"){e.target.disabled=true;try{await me.reload();me=auth.currentUser;if(me.emailVerified){await me.getIdToken(true);gateErr="";gateMsg="";await enter()}else{gateErr=L.notVerified;render()}}catch(err){gateErr=authError(err);render()}}
  if(id==="v-resend"){try{await sendEmailVerification(me);gateErr="";gateMsg=L.resent}catch(err){gateErr=authError(err)}render()}
  if(id==="n-check"){e.target.disabled=true;await enter()}
  if(id==="g-signout"){await signOut(auth)}
});
$("view").addEventListener("submit",async e=>{if(e.target.id!=="authform")return;e.preventDefault();
  const em=lower($("a-email").value),pw=$("a-pw").value,btn=$("a-submit");btn.disabled=true;gateErr="";gateMsg="";
  try{if(gateMode==="signup"){const c=await createUserWithEmailAndPassword(auth,em,pw);try{await sendEmailVerification(c.user)}catch(_){}}
    else await signInWithEmailAndPassword(auth,em,pw)}
  catch(err){gateErr=authError(err);render();const f=$("a-email");if(f)f.value=em}});
$("view").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const el=e.target.closest("[data-edit][tabindex]");if(el&&activate(el))e.preventDefault()});
$("view").addEventListener("change",e=>{if(e.target.id==="mfilter"){moneyFilter=e.target.value;render()}});
addEventListener("online",render);addEventListener("offline",render);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e});

/* ---------------- data ---------------- */
function stopData(){unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];for(const c of COLS)S[c]=[];dbReady=false}
async function enter(){
  me=auth.currentUser;if(!me){screen="signin";render();return}
  if(!me.emailVerified){screen="verify";render();return}
  const em=lower(me.email);isOwner=(window.CHARITY_CONFIG.ownerEmails||[]).map(lower).includes(em);
  myAccess=null;
  try{const snap=await getDoc(doc(db,"access",em));if(snap.exists())myAccess=snap.data()}catch(e){}
  if(!isOwner&&!myAccess){screen="notmember";render();return}
  isAdmin=isOwner||!!(myAccess&&myAccess.admin);
  screen="app";startData();render();
}
function startData(){stopData();const loaded=new Set();
  for(const c of COLS){unsubs.push(onSnapshot(collection(db,c),snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded.add(c);if(loaded.size===COLS.length)dbReady=true;if(screen==="app")renderApp()},
    err=>{loaded.add(c);if(loaded.size===COLS.length)dbReady=true;if(err&&err.code==="permission-denied"&&c==="members"){stopData();screen="notmember";render()}}))}
  // keep my own access (role) up to date
  unsubs.push(onSnapshot(doc(db,"access",lower(me.email)),s=>{myAccess=s.exists()?s.data():null;const was=isAdmin;isAdmin=isOwner||!!(myAccess&&myAccess.admin);
    if(!isOwner&&!myAccess){stopData();screen="notmember";render();return}if(was!==isAdmin&&screen==="app")render()},()=>{}));
}

function boot(){
  const cfg=window.CHARITY_CONFIG;
  if(!cfg||!cfg.firebase||!cfg.firebase.apiKey||cfg.firebase.apiKey==="PASTE_HERE"){screen="setup";render();return}
  const app=initializeApp(cfg.firebase);
  auth=getAuth(app);auth.languageCode=lang;
  try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}
  onAuthStateChanged(auth,async u=>{stopData();me=u;myAccess=null;isAdmin=false;isOwner=false;
    if(!u){screen="signin";render();return}
    await enter()});
}
render();
try{boot()}catch(e){screen="setup";render()}
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
